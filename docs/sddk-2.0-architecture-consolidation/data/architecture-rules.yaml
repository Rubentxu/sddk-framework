waivers:
  - id: WV-0015-ARCH003-composition-root
    rule_id: ARCH003
    reason: "Two composition-root edges in sddk-cli survive the cli-depersistence cycle (SDDK2-103): (a) use sddk_storage::SqliteControlPlane in lib.rs compose() to construct the adapter injected into Box<dyn ControlPlane>, (b) pub use sddk_storage::Storage re-export to satisfy Engine<Storage> wiring without leaking the concrete type into every CLI module. The downcast fallback in failure_envelope is also covered so error envelopes stay actionable while Storage inherent methods still return the concrete StorageError type. See docs/adr/ADR-0015-arch003-composition-root-waiver.md."
    granted_until_sha: f054680d716abeff21ef0e7a7b759b1203ec9cb6
    granted_by: orchestrator + sddk-apply
    granted_at: '2026-08-17T11:05:00Z'
