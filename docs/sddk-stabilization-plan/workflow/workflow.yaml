schema_version: 1
workflow:
  id: sddk-standard
  version: 0.1.0
  description: Workflow determinista inicial de SDDK.

statuses:
  - OPEN
  - BLOCKED
  - REMEDIATING
  - RELEASE_PENDING
  - RELEASED
  - CLOSED
  - ABANDONED
  - RECOVERING

phases:
  - explore
  - specify
  - design
  - plan
  - build
  - verify
  - review
  - release
  - archive

policies:
  active_cycles_per_project: 1
  debt_verification: optional
  require_clean_worktree_on_start: true
  shell_arbitrary: forbidden

transitions:
  - id: cycle.start
    from: null
    to:
      status: OPEN
      phase: explore
    requires:
      - project.adopted
      - project.initialized
      - worktree.clean
      - cycle.no_active_conflict
    produces:
      - cycle-manifest

  - id: phase.explore.complete
    from:
      status: OPEN
      phase: explore
    to:
      status: OPEN
      phase: specify
    requires:
      - artifact: exploration-report
      - gate: exploration-sufficient

  - id: phase.specify.complete
    from:
      status: OPEN
      phase: specify
    to:
      status: OPEN
      phase: design
    requires:
      - artifact: specification
      - gate: requirements-testable

  - id: phase.design.complete
    from:
      status: OPEN
      phase: design
    to:
      status: OPEN
      phase: plan
    requires:
      - artifact: design
      - gate: architecture-consistent

  - id: phase.plan.complete
    from:
      status: OPEN
      phase: plan
    to:
      status: OPEN
      phase: build
    requires:
      - artifact: implementation-plan
      - gate: plan-executable

  - id: phase.build.complete
    from:
      status: OPEN
      phase: build
    to:
      status: OPEN
      phase: verify
    requires:
      - artifact: implementation-receipt
      - gate: implementation-complete

  - id: phase.verify.complete
    from:
      status: OPEN
      phase: verify
    to:
      status: OPEN
      phase: review
    requires:
      - artifact: verification-report
      - gate: tests-pass
      - gate: policy-compliant
    on_failure:
      status: REMEDIATING
      phase: verify

  - id: phase.review.complete
    from:
      status: OPEN
      phase: review
    to:
      status: RELEASE_PENDING
      phase: release
    requires:
      - artifact: review-report
      - gate: review-approved

  - id: release.complete
    from:
      status: RELEASE_PENDING
      phase: release
    to:
      status: RELEASED
      phase: archive
    requires:
      - artifact: merge-receipt
      - artifact: release-receipt
      - gate: no-pending-effects

  - id: archive.complete
    from:
      status: RELEASED
      phase: archive
    to:
      status: CLOSED
      phase: archive
    requires:
      - artifact: archive-manifest
      - gate: ledger-valid
      - gate: vault-index-current
