name: many-events-deterministic
events:
  - event_type: approval.capability.requested
    subjects: [[cycle, c-1], [capability, git.commit]]
    cycle_id: c-1
  - event_type: approval.capability.granted
    subjects: [[actor, alice], [capability, git.commit]]
    cycle_id: c-1
  - event_type: workflow.phase.entered
    subjects: []
    cycle_id: c-1
    payload: {phase: verify}
  - event_type: workflow.phase.exited
    subjects: []
    cycle_id: c-1
  - event_type: task.depends_on
    subjects: [[task, A], [task, B]]
    cycle_id: c-1
expect:
  nodes: 6
  edges: 5
