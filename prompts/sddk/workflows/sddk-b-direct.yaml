# SDDK B-direct — Bypass SDDK for hotfixes and well-known changes
# Status: STABLE (extracted from orchestrator.md § Path-specific sequences B-direct row)
# Source: prompts/sddk/mcw.md § Phase 1 B-direct + orchestrator.md § Path B
# Trigger: context_quality C3 + jurisprudence hit, OR user explicit "just do it" / "fix it"
# v3.3: NO opt-ins. B-direct never invokes debt-verify (it's a hotfix). release remains mandatory.
# Patterns: 4 (smallest workflow)

name: sddk-b-direct
version: "1.1.0"
status: stable
description: |
  Bypass the full SDDK cycle for hotfixes, well-known changes, or C3 context with jurisprudence hit.
  Load skill → execute → light verify → archive → release. NO spec, NO propose, NO design, NO tasks, NO coherence gates, NO debt-verify.
  Smallest, fastest workflow. Release remains mandatory post-archive.

pattern_composition:
  - routing                       # Triage gate selects this workflow
  - prompt-chain                  # skill → execute → verify (linear)
  - multi-lens-verification       # 1 lens light verify
  - hitl-gate                     # PR approval
  - trunk-sync-gate               # Hard gates pre/post cycle

trigger:
  goal_pattern:
    - hotfix
    - well-known change
    - C3 quality with jurisprudence hit
    - user "just do it"
    - user "fix it"
  context_quality: [C3]
  path: B-direct

context_requirements:
  sddk_init_done: true
  branch_isolation: per_change

phases:
  # ─── PHASE 0 — TRUNK SYNC (minimal) ────────────────────────────────
  - phase: trunk-sync-start
    step: 0.1
    pattern: trunk-sync-gate
    agent: orchestrator
    gate: "git rev-parse HEAD == origin/main"
    failure_mode: BLOCK

  # v3.4: ROADMAP Serialization Lock — even B-direct hotfixes must respect one-cycle-at-a-time
  - phase: previous-cycle-closed
    step: 0.2
    pattern: trunk-sync-gate
    agent: orchestrator
    gate: "ROADMAP 'Active Milestones' has zero in_progress entries"
    failure_mode: BLOCK — resume prior cycle or mark it blocked/abandoned in ROADMAP
    notes: |
      Even hotfixes respect the serialization lock. Read docs/ROADMAP.md, check Active Milestones.
      If an active cycle exists, the user must close it (release), mark it blocked, or abandon it
      before this hotfix can proceed.

  # SKIP 0.3 — knowledge coverage (B-direct doesn't need full knowledge audit)
  # SKIP 0.4 — formal triage (already decided B-direct at invocation)

  # ─── PHASE 1 — EXECUTE (no plan artifacts) ──────────────────────────
  - phase: load-skill
    step: 1.0
    pattern: prompt-chain
    agent: orchestrator
    rule: "load matching skill via skill() tool"
    notes: |
      Path B (Direct Skill Delegation) per orchestrator.md § Routing Decision:
      - "Review this PR/code" → judgment-day
      - "Split this PR" → chained-pr
      - "Create a PR" → branch-pr
      - "Create an issue" → issue-creation
      - "Design test strategy" → test-pyramid
      - "Design this API/interface" → design-an-interface
      - "Find refactoring opportunities" → improve-codebase-architecture
      - "Resolve this term/glossary conflict" → grill-with-docs
      - "Stress-test this plan/proposal" → auto-grill-loop
      - "Plan commits for this change" → work-unit-commits
      - "Debug this runtime issue" → chronos-sdd (when chronos available)
      - "Audit architecture/connascence" → cognicode-sdd (when available)
      - "Design/redesign/critique/polish UI" → impeccable

  - phase: execute
    step: 1.1
    pattern: prompt-chain
    agent: orchestrator
    rule: "execute skill in main conversation (not via task delegation)"
    notes: "Inline execution — no sddk-* phase agents"

  - phase: branch-creation
    step: 1.8
    pattern: trunk-sync-gate
    rule: "git checkout -b <type>/<description> && git push -u origin <branch>"
    gate: "branch matches ^[a-z]+/[a-z0-9-]+$"
    conditional: "execution produced commits"

  # ─── PHASE 2 — LIGHT VERIFY (single lens) ───────────────────────────
  - phase: verify
    step: 2.3
    pattern: multi-lens-verification
    agent: orchestrator
    parallel_group: verify-lenses
    lenses: 1  # single lens only (per orchestrator.md § Multi-lens verify)
    notes: "B-direct = 1 lens (light verify)"
    gate: "verdict PASS or PW"
    output: minimal verify note
    failure_mode: FAIL → fix inline (no formal correction cycle)

  # SKIP 2.4 — debt-verify NOT ASKED for B-direct (per MCW + orchestrator.md)

  - phase: archive
    step: 2.5
    pattern: prompt-chain
    agent: orchestrator
    notes: "Light archive — minimal report"

  # ─── PHASE 3 — CONSOLIDATE (single agent: sddk-release) ─────
  # NOTE (v3.3): see sddk-a-full.yaml § Phase 3 for the consolidation rationale.
  # B-direct hotfixes usually produce patch tags. close-tracking-issue is a
  # no-op when no tracking issue exists, so the agent still owns it.
  - phase: release
    step: 3
    pattern: orchestrator-worker
    agent: sddk-release
    model: GLM-4.7
    depends_on: archive
    mandatory: true
    policy_routing:
      default: auto
      override_field: launch_plan.merge_policy
      overrides: [strict, guided]
    sub_steps_owned_by_agent:
      - push-branch
      - create-pr
      - wait-approval
      - merge-to-main
      - semver-tag
      - html-closing-report   # conditional: only on major tags
      - close-tracking-issue  # no-op when no tracking issue
      - update-knowledge-graph  # v3.5: vault nodes (conditional: only if cycle created/touched knowledge)
      - release-lock            # v3.5: serialization lock
    html_conditional: "only when tag bump is major"
    roadmap_conditional: "only when change is milestone-related"
    bump_default: patch     # hotfixes = patch
    gate: "release-report persisted with status=success and main HEAD == origin/main"
    output: release-report.md
    failure_modes:
      - status=blocked:
          action: "release-report persisted with blockers[]; user re-runs /sddk-release <change>"
          replayable: true
    source_of_truth: prompts/sddk/git-contract.md
    contract: skills/sddk-release/SKILL.md

  # ─── PHASE 4 — TRUNK SYNC + F3 + RESET (minimal) ────────────────────
  - phase: trunk-sync-end
    step: 4.1
    pattern: trunk-sync-gate
    gate: "HEAD == origin/main"

  - phase: f3-self-tuning
    step: 4.2
    pattern: evaluator-optimizer
    output: sddk/next-tuning.md

  # SKIP 4.3 — save-jurisprudence (B-direct rarely produces reusable jurisprudence)

  - phase: result-contract
    step: 4.4
    pattern: prompt-chain
    agent: orchestrator
    # v3.4: Release Completion Guard — even hotfixes must merge to main before cycle closes.
    preconditions:
      - "release phase returned status=success"
      - "main HEAD == origin/main (bash-verified)"
      - "semver tag exists on remote (minimum: patch)"
    precondition_fail_action: "emit status=blocked, next_recommended=/sddk-release <change>, do NOT declare cycle closed"

success_criteria:
  - "skill loaded and executed"
  - "branch created and commits pushed"
  - "PR merged to main"
  - "semver tag pushed and confirmed on remote (minimum: patch bump)"
  - "main HEAD == origin/main (trunk-sync-end PASS)"
  - "release-report status=success persisted"
  - "minimal metrics saved"

failure_modes:
  - condition: "skill execution FAIL"
    action: "inline retry, no formal cycle"
  - condition: "verify FAIL"
    action: "inline fix"
  - condition: "PR not merged (24h)"
    action: "BLOCK, notify user"

provenance:
  derived_from:
    - "prompts/sddk/mcw.md § Phase 1 B-direct"
    - "prompts/sddk/orchestrator.md § Path-specific sequences (B-direct row)"
    - "prompts/sddk/orchestrator.md § Routing Decision (Path B)"
  catalog_ref: "docs/sddk-evolution/agentic-workflow-patterns-catalog.md"
  integration_design: "docs/sddk-evolution/dynamic-workflows-integration.md"
  notes: |
    B-direct does NOT bypass the orchestrator or git — it bypasses the SDD phases (spec/propose/design/tasks).
    Git flow (trunk-sync, branch, PR, tag) is still mandatory per git-contract.md.
    Debt-verify is NOT invoked for B-direct (per orchestrator.md § Debt-Verify Opt-In Question).
    C3 + jurisprudence hit is the most common trigger — past solution covers the change.
