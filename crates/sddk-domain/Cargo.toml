[package]
name = "sddk-domain"
version = "1.4.0"
edition = "2024"
authors = ["SDDK Team"]
license = "MIT"
rust-version.workspace = true

[features]
default = []
std = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
jsonschema = { version = "0.49", default-features = false, features = ["resolve-file"] }
toml = "1.1"

[dev-dependencies]
proptest = "1.11"
tempfile = { workspace = true }
serde-saphyr = { workspace = true }
