name: Release automation

# Fully automatic release pipeline. Triggered by the Auto-merge workflow
# completing (the auto-merge squash to main does NOT emit a push event, so
# `push: branches: [main]` would never fire for bot merges):
#   1. maybe-release: conventional commits since the last tag produce a
#      release PR (version bump + CHANGELOG) on a release/vX.Y.Z branch.
#   2. tag-release: when main carries a version with no tag yet, push
#      vX.Y.Z, which triggers the Release workflow.
#
# Loop protection: maybe-release skips when main's version is already
# tagged (the release PR merge case), chore(release) commits are excluded
# from the bump calculation, and tag-release only acts when the version is
# ahead of the last tag. Serialized via concurrency.

on:
  workflow_run:
    workflows: [Auto-merge]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-automation
  cancel-in-progress: false

jobs:
  maybe-release:
    name: Maybe open release PR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Detect pending release
        id: detect
        run: |
          OUTPUT="$(bash scripts/release-bump.sh --dry-run 2>&1 || true)"
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q '^new tag:'; then
            NEW_TAG="$(echo "$OUTPUT" | grep -oE '^new tag: v[0-9]+\.[0-9]+\.[0-9]+$' | awk '{print $3}')"
            echo "pending=$NEW_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "pending=" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump and open release PR
        if: steps.detect.outputs.pending != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_TAG="${{ steps.detect.outputs.pending }}"
          BRANCH="release/${NEW_TAG#v}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "release branch $BRANCH already exists; not creating another"
            exit 0
          fi
          git config user.name "sddk-release-bot"
          git config user.email "sddk-release-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          bash scripts/release-bump.sh
          git add -A
          git commit -m "chore(release): ${NEW_TAG#v}"
          git push -u origin "$BRANCH"
          gh pr create --head "$BRANCH" --base main \
            --title "chore(release): ${NEW_TAG#v}" \
            --body "Automated release PR generated by the Release automation workflow.
          
          - Version bump $(git describe --tags --abbrev=0 | sed 's/^v//') -> ${NEW_TAG#v} (workspace + 7 crates + manifest.toml + Cargo.lock)
          - CHANGELOG.md updated from conventional commits
          - Merge to publish; CI + auto-merge will handle the rest." || \
            echo "PR already exists or creation failed"

  tag-release:
    name: Tag unreleased version
    runs-on: ubuntu-latest
    needs: [maybe-release]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Tag if main is ahead of the last tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -m1 '^version = ' manifest.toml | sed -E 's/version = "([^"]+)"/\1/')"
          LAST="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          CURRENT="${LAST#v}"
          echo "manifest version: $VERSION, last tag: $LAST"
          if [ "$VERSION" != "$CURRENT" ]; then
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
              echo "tag $TAG already exists on origin"
              exit 0
            fi
            git config user.name "sddk-release-bot"
            git config user.email "sddk-release-bot@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "pushed tag $TAG — Release workflow triggered"
          else
            echo "main version $VERSION already tagged; nothing to do"
          fi
