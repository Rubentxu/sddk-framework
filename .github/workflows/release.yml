name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: sddk-linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: sddk-linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset: sddk-linux-aarch64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: sddk-darwin-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy
          rustup default 1.91.0

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl cross tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} -p sddk-cli --locked

      - name: Package dist (checksums + SBOM + attestation)
        run: ./target/${{ matrix.target }}/release/sddk release dist --prefix dist-out --channel release --commit "$GITHUB_SHA"

      - name: Stage assets
        run: |
          mkdir -p assets
          cp dist-out/dist/sddk "assets/${{ matrix.asset }}"
          cp dist-out/dist/sbom.json "assets/${{ matrix.asset }}.sbom.json"
          cp dist-out/dist/attestation.json "assets/${{ matrix.asset }}.attestation.json"
          cp dist-out/dist/checksums.txt "assets/${{ matrix.asset }}.CHECKSUMS"
          (cd assets && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: assets/*
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" --generate-notes --title "$TAG" \
              --repo "${{ github.repository }}" || true
            gh release upload "$TAG" assets/* --clobber --repo "${{ github.repository }}"
          else
            echo "manual run (no tag): assets staged in workflow artifacts"
          fi
